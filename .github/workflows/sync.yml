name: Sync prices

on:
  schedule:
    # Both APIs reset their daily quota at 00:00 UTC and TCG API publishes new
    # prices just after; 06:00 UTC leaves room for either to run late.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: prices
        options: [prices, catalog]
      game:
        description: Game id (catalog job only)
        default: riftbound
      max_requests:
        description: Request budget for this run
        default: "40"
      source:
        description: Limit the prices job to one source (justtcg or tcgapi); empty = both
        default: ""

# Never let two runs spend quota at the same time.
concurrency:
  group: sync
  cancel-in-progress: false

# Catalogs the scheduled run keeps importing (resumable, oldest sets first) until each
# one is complete. Space-separated game ids; empty to disable.
env:
  CATALOG_GAMES: pokemon

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to commit SHAs so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Secrets are scoped to the two sync steps, so the setup actions never see them.
      # Inputs go through env vars rather than straight into the shell command.
      - name: Refresh prices for tracked cards
        if: ${{ github.event_name == 'schedule' || inputs.job == 'prices' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          TCGAPI_API_KEY: ${{ secrets.TCGAPI_API_KEY }}
          # Scheduled runs keep most of the TCG API budget for the catalog step below.
          MAX_REQUESTS: ${{ inputs.max_requests || '20' }}
          SOURCE: ${{ inputs.source }}
        run: |
          args=(--max-requests "$MAX_REQUESTS")
          if [ -n "$SOURCE" ]; then args+=(--source "$SOURCE"); fi
          pnpm exec tsx scripts/sync-prices.ts "${args[@]}"

      - name: Continue catalog imports
        if: ${{ github.event_name == 'schedule' && env.CATALOG_GAMES != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TCGAPI_API_KEY: ${{ secrets.TCGAPI_API_KEY }}
        run: |
          for game in $CATALOG_GAMES; do
            pnpm exec tsx scripts/sync-catalog.ts "$game" --max-requests 35 --only-if-incomplete
          done

      - name: Import catalog
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.job == 'catalog' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TCGAPI_API_KEY: ${{ secrets.TCGAPI_API_KEY }}
          GAME: ${{ inputs.game }}
          MAX_REQUESTS: ${{ inputs.max_requests || '40' }}
        run: pnpm exec tsx scripts/sync-catalog.ts "$GAME" --max-requests "$MAX_REQUESTS"
